<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#fff4f3" />
  <title>Для тебя ♡</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      min-height: 100svh; margin: 0; padding: 24px;
      display: grid; place-items: center;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: #66434f;
      background: radial-gradient(circle at 15% 15%, #ffe0e8 0, transparent 40%),
                  radial-gradient(circle at 90% 90%, #f7dce9 0, transparent 42%), #fff8f6;
    }
    .card {
      width: min(100%, 460px); padding: 44px 30px 42px;
      text-align: center; background: #ffffffd9;
      border: 1px solid #fff; border-radius: 28px;
      box-shadow: 0 20px 70px #a75f7924;
    }
    .heart { font-size: 57px; color: #f07596; line-height: 1; animation: beat 2.8s ease-in-out infinite; }
    h1 { font-size: clamp(30px, 6vw, 43px); line-height: 1.15; margin: 22px 0 16px; font-weight: 750; letter-spacing: -1px; }
    p { margin: 0 auto; max-width: 330px; font-size: 17px; line-height: 1.65; }
    button {
      margin-top: 30px; border: none; border-radius: 999px;
      padding: 15px 30px; background: #ec7394; color: white;
      font: inherit; font-weight: 650; cursor: pointer;
      box-shadow: 0 9px 22px #ed73943d; transition: transform .2s, background .2s;
    }
    button:hover { transform: translateY(-2px); background: #df6488; }
    button:focus-visible { outline: 3px solid #8e4863; outline-offset: 4px; }
    .message { display: none; margin-top: 26px; padding-top: 23px; border-top: 1px solid #f7d5df; }
    .message.visible { display: block; animation: appear .45s ease both; }
    .signature { font-size: 14px; color: #ad768a; margin-top: 15px; }
    .foot { margin-top: 27px; color: #ae8a98; font-size: 12px; letter-spacing: .5px; }
    @keyframes beat { 0%, 100% { transform: scale(1) } 50% { transform: scale(1.08) } }
    @keyframes appear { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: translateY(0) } }
    @media (prefers-reduced-motion: reduce) { .heart, .message.visible { animation: none; } button { transition: none; } }
  </style>
</head>
<body>
  <main class="card">
    <div class="heart" aria-hidden="true">♥</div>
    <h1>Ты — моё счастье ♡</h1>
    <p>Просто хотел напомнить, как сильно я рад, что ты есть в моей жизни.</p>
    <button id="open" type="button" aria-controls="surprise" aria-expanded="false">Нажми сюда 💌</button>
    <div class="message" id="surprise" aria-live="polite">
      <p>С тобой даже самый обычный день становится особенным. Спасибо тебе за улыбки, тепло и за то, что ты рядом. Очень тебя люблю ❤️</p>
      <div class="signature">Твой любимый ♡</div>
    </div>
    <div class="foot">маленький сайт для самого важного человека</div>
  </main>
  <script>
    const button = document.getElementById('open');
    const surprise = document.getElementById('surprise');
    button.addEventListener('click', () => {
      surprise.classList.add('visible');
      button.setAttribute('aria-expanded', 'true');
      button.hidden = true;
    });
  </script>
</body>
</html>
